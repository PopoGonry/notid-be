spring:
  datasource:
    url: jdbc:h2:file:~/notid;MODE=MySQL;AUTO_SERVER=TRUE  # 파일 모드 (프로젝트 폴더에 notid.mv.db 파일이 생김)
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # ★ 이 부분이 빠져 있어서 웹 접속이 안 된 겁니다!
  h2:
    console:
      enabled: true       # 콘솔 켜기
      path: /h2-console   # 접속 주소 설정
      settings:
        web-allow-others: true # 외부 접속 허용 (선택)

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
    show-sql: true

logging:
  level:
    org.hibernate.SQL: debug

jwt:
  secret: V2hhdElzVGhpc1NlY3JldEtleUZvckpXVFZlcmlmaWNhdGlvbg== # 임시 키 (나중엔 환경변수로 빼야 함)
  expiration: 3600000 # 1시간 (밀리초 단위)