name: NotiD CD (Docker Build & Push)

# 코드가 브랜치에 직접 푸시되거나 PR이 머지되었을 때만 실행됩니다.
on:
  push:
    branches: [ "master", "develop" ]

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 이미 PR 단계에서 테스트를 통과했으므로 '-x test'로 테스트를 건너뛰고 빠르게 빌드합니다.
    - name: Build JAR (Skip tests)
      run: ./gradlew clean build -x test

    # 깃허브 시크릿에 저장된 정보로 도커 허브에 로그인합니다.
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 도커 이미지를 굽고 허브로 푸시합니다.
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/notid-backend:latest
          ${{ secrets.DOCKER_USERNAME }}/notid-backend:${{ github.sha }}
